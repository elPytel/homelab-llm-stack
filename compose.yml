services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    mem_limit: ${WEBUI_MEM_LIMIT:-12g}
    cpus: ${WEBUI_CPUS:-1}
    ports:
      - "11434:11434"
    volumes:
      - ${CONFIG_PATH:-./config}/ollama:/root/.ollama:z
    environment:
      - TZ=${TZ:-Etc/UTC}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    mem_limit: ${WEBUI_MEM_LIMIT:-2g}
    cpus: ${WEBUI_CPUS:-1}
    ports:
      - "3000:8080"
    volumes:
      - ${CONFIG_PATH:-./config}/open-webui:/app/backend/data:z
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
    depends_on:
      - ollama